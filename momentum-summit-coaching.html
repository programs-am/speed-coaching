<style>
/* Layout: one narrow column, phone first. Brand: charcoal-to-plum ground, mint accent, Montserrat, halftone dot waves. Single dark look by design. */
:root {
  --bg-top: #1b2626;
  --bg-bottom: #2f1d33;
  --bg: #241f2c;
  --surface: rgba(255,255,255,.055);
  --surface-strong: rgba(255,255,255,.09);
  --ink: #ffffff;
  --muted: #b9b2c4;
  --line: rgba(255,255,255,.13);
  --mint: #74e0c1;
  --mint-ink: #12221f;
  --mint-soft: rgba(116,224,193,.14);
  --plum-dot: #8e6f97;
  --font: "Montserrat", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  background: var(--bg);
  background-image: linear-gradient(160deg, var(--bg-top) 0%, var(--bg) 45%, var(--bg-bottom) 100%);
  background-attachment: fixed;
  color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.45; font-weight: 500;
  min-height: 100%; position: relative; overflow-x: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg-top); }
/* halftone dot waves, echoing the event graphics */
.dots { position: fixed; pointer-events: none; z-index: 0; }
.dots.mint { left: -60px; bottom: -40px; width: 340px; height: 260px;
  background: radial-gradient(circle, var(--mint) 1.3px, transparent 1.8px) 0 0 / 9px 9px;
  -webkit-mask: radial-gradient(ellipse 70% 60% at 20% 100%, #000 15%, transparent 70%); mask: radial-gradient(ellipse 70% 60% at 20% 100%, #000 15%, transparent 70%); opacity: .7; }
.dots.plum { right: -80px; top: 40px; width: 300px; height: 520px;
  background: radial-gradient(circle, var(--plum-dot) 1.1px, transparent 1.6px) 0 0 / 8px 8px;
  -webkit-mask: radial-gradient(ellipse 45% 60% at 85% 45%, #000 10%, transparent 70%); mask: radial-gradient(ellipse 45% 60% at 85% 45%, #000 10%, transparent 70%); opacity: .55; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); position: relative; z-index: 1; }

/* Masthead */
.mast .wrap { padding-block: 22px 8px; display: grid; gap: 18px; }
.topline { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.am { font-weight: 700; font-size: 17px; line-height: .95; letter-spacing: -.01em; }
.am .toggle { display: inline-block; width: 1.25em; height: .62em; border-radius: 999px; background: #9a9aa3; vertical-align: -.02em; position: relative; margin: 0 .02em; }
.am .toggle::after { content: ""; position: absolute; right: .06em; top: .06em; width: .5em; height: .5em; border-radius: 50%; background: #e9e9ee; }
.stack { font-weight: 900; text-transform: uppercase; font-size: 13px; line-height: 1.02; text-align: right; letter-spacing: .02em; }
.hero h1 { font-weight: 900; font-size: clamp(40px, 13vw, 60px); line-height: .95; letter-spacing: -.02em; margin: 0; color: var(--mint); }
.hero p { margin: 8px 0 0; font-weight: 800; font-size: clamp(18px, 5.4vw, 24px); line-height: 1.15; }
.viewing .hero h1 { font-size: 30px; }
.viewing .hero p { display: none; }
.hero .meta-line { margin-top: 10px; font-weight: 600; font-size: 13px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }

main .wrap { padding-block: 22px 40px; display: grid; gap: 18px; }

/* Picker */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 14px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.step-label { font-weight: 800; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--mint); margin: 0; }
.roles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.role { appearance: none; font: inherit; font-weight: 800; font-size: 17px; color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 14px 12px; cursor: pointer; text-align: left; display: grid; gap: 2px; }
.role small { font-weight: 500; font-size: 13px; color: var(--muted); }
.role[aria-pressed="true"] { border-color: var(--mint); background: var(--mint-soft); }
.role:focus-visible, select:focus-visible, .btn:focus-visible, a:focus-visible, .foot button:focus-visible { outline: 3px solid var(--mint); outline-offset: 2px; }
select { width: 100%; font: inherit; font-size: 17px; font-weight: 600; color: var(--ink); background: var(--bg); border: 2px solid var(--line); border-radius: 12px; padding: 14px 12px; }
select:disabled { opacity: .5; }
.btn { appearance: none; font: inherit; font-weight: 800; font-size: 17px; border: 0; border-radius: 12px; padding: 15px 16px; background: var(--mint); color: var(--mint-ink); cursor: pointer; }
.btn:disabled { opacity: .35; cursor: default; }
.btn.ghost { background: transparent; color: var(--mint); border: 2px solid var(--line); padding: 10px 14px; font-size: 15px; }
.note { color: var(--muted); font-size: 14px; margin: 0; }

/* Agenda */
#agenda, #all { display: grid; gap: 18px; }
.who { display: grid; gap: 4px; }
.who .tag { justify-self: start; font-weight: 800; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; background: var(--mint); color: var(--mint-ink); padding: 4px 8px; border-radius: 6px; }
.who h2 { font-weight: 900; font-size: 30px; line-height: 1.05; margin: 6px 0 0; text-wrap: balance; letter-spacing: -.01em; }
.who p { margin: 0; color: var(--muted); }
.tally { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.pill { font-size: 12.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--mint-soft); color: var(--mint); }

.rounds { list-style: none; margin: 0; padding: 0; display: grid; }
.round { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 12px; position: relative; padding-bottom: 14px; }
.round:not(:last-child)::before { content: ""; position: absolute; left: 23px; top: 48px; bottom: 0; width: 2px; background: repeating-linear-gradient(var(--line) 0 4px, transparent 4px 8px); }
.num { width: 48px; height: 48px; border-radius: 50%; background: var(--mint); color: var(--mint-ink); display: grid; place-items: center; font-weight: 900; font-size: 22px; font-variant-numeric: tabular-nums; }
.round.off .num { background: transparent; color: var(--muted); border: 2px dashed var(--line); }
.slot { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: grid; gap: 6px; min-width: 0; }
.round.off .slot { background: transparent; border-style: dashed; }
.slot .when { font-weight: 700; font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--mint); }
.round.off .slot .when { color: var(--muted); }
.slot .name { font-weight: 800; font-size: 20px; line-height: 1.2; }
.slot .meta { color: var(--muted); font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.chip { font-size: 12.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--surface-strong); color: var(--ink); }
.chip.ind { background: transparent; border: 1px solid var(--line); color: var(--muted); }
.goal { font-size: 14px; margin: 2px 0 0; padding-left: 10px; border-left: 3px solid var(--mint); }
.slot a { color: var(--mint); font-weight: 700; font-size: 14px; text-decoration: none; }
.slot a:hover { text-decoration: underline; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }

/* Full grid */
.grid-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
table { border-collapse: collapse; font-size: 14px; min-width: 620px; width: 100%; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
thead th { font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--mint); }
tbody th { font-weight: 800; white-space: nowrap; }
tr:last-child td, tr:last-child th { border-bottom: 0; }
.foot { color: var(--muted); font-size: 13px; text-align: center; padding-bottom: 20px; }
.foot button { background: none; border: 0; color: var(--mint); font: inherit; font-weight: 700; cursor: pointer; text-decoration: underline; }
@media (prefers-reduced-motion: no-preference) { .round { animation: rise .35s ease both; } .round:nth-child(2){animation-delay:.05s}.round:nth-child(3){animation-delay:.1s}.round:nth-child(4){animation-delay:.15s} }
@keyframes rise { from { transform: translateY(6px); } to { transform: none; } }
</style>
</head>

  function chips(list, cls) { return list.map(function (a) { return '<span class="chip' + (cls ? ' ' + cls : '') + '">' + esc(a) + '</span>'; }).join(''); }
  function whyChips(text) {
    if (!text || text.indexOf('Balance') === 0) return '';
    var parts = text.split(' + '), out = [];
    parts.forEach(function (t) {
      if (t.indexOf('industry: ') === 0) out.push('<span class="chip ind">Same industry: ' + esc(t.slice(10)) + '</span>');
      else t.split(', ').forEach(function (a) { if (a) out.push('<span class="chip">' + esc(a) + '</span>'); });
    });
    return out.length ? '<div class="meta">Matched on</div><div class="chips">' + out.join('') + '</div>' : '';
  }
  function liLink(url, name) { return url ? '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(name.split(' ')[0]) + ' on LinkedIn ↗</a>' : ''; }
  function actions() { return '<div class="actions"><button type="button" class="btn ghost" data-back>← Pick a different name</button></div>'; }

  function participantView(name) {
    var p = P[name]; if (!p) return false;
    var count = 0, items = '';
    for (var r = 0; r < D.rounds; r++) {
      var ci = -1;
      D.grid.forEach(function (row, i) { if (row[r + 1] === name) ci = i; });
      if (ci < 0) {
        items += '<li class="round off"><div class="num">' + (r + 1) + '</div><div class="slot"><div class="when">' + esc(whenLabel(r)) + '</div><div class="name">Off rotation</div><div class="meta">No coaching session this round.</div></div></li>';
      } else {
        count++;
        var c = C[D.grid[ci][0]] || { n: D.grid[ci][0], co: '', role: '', li: '' };
        items += '<li class="round"><div class="num">' + (r + 1) + '</div><div class="slot"><div class="when">' + esc(whenLabel(r)) + ' · Your coach</div><div class="name">' + esc(c.n) + '</div><div class="meta">' + esc([c.role, c.co].filter(Boolean).join(', ')) + '</div>' + whyChips(D.why[ci][r + 1]) + liLink(c.li, c.n) + '</div></li>';
      }
    }
    agenda.innerHTML = '<div class="who"><span class="tag">Participant</span><h2>' + esc(p.n) + '</h2><p>' + esc(p.co) + '</p><div class="tally"><span class="pill">' + count + ' of ' + D.rounds + ' rounds with a coach</span></div></div><ol class="rounds">' + items + '</ol>' + actions();
    return true;
  }

  function coachView(name) {
    var ci = -1; D.grid.forEach(function (row, i) { if (row[0] === name) ci = i; });
    var c = C[name]; if (!c || ci < 0) return false;
    var items = '';
    for (var r = 0; r < D.rounds; r++) {
      var who = D.grid[ci][r + 1];
      if (!who || who === OPEN) {
        items += '<li class="round off"><div class="num">' + (r + 1) + '</div><div class="slot"><div class="when">' + esc(whenLabel(r)) + '</div><div class="name">Open seat</div><div class="meta">Take a walk-in participant.</div></div></li>';
        continue;
      }
      var p = P[who] || { n: who, co: '', ind: '', areas: [], goal: '', li: '' };
      items += '<li class="round"><div class="num">' + (r + 1) + '</div><div class="slot"><div class="when">' + esc(whenLabel(r)) + ' · You\'re meeting</div><div class="name">' + esc(p.n) + '</div><div class="meta">' + esc([p.co, p.ind].filter(Boolean).join(' · ')) + '</div>' +
        (p.areas.length ? '<div class="meta">Wants coaching in</div><div class="chips">' + chips(p.areas) + '</div>' : '<div class="meta">No pre-event survey. Start by asking what they’re working on.</div>') +
        (p.goal ? '<p class="goal">' + esc(p.goal) + '</p>' : '') + liLink(p.li, p.n) + '</div></li>';
    }
    agenda.innerHTML = '<div class="who"><span class="tag">Coach</span><h2>' + esc(c.n) + '</h2><p>' + esc([c.role, c.co].filter(Boolean).join(', ')) + '</p><div class="tally">' + c.areas.map(function (a) { return '<span class="pill">' + esc(a) + '</span>'; }).join('') + '</div></div><ol class="rounds">' + items + '</ol>' + actions();
    return true;
  }

  function allView() {
    var head = '<tr><th scope="col">Coach</th>' + Array.from({ length: D.rounds }, function (_, r) { return '<th scope="col">' + esc(whenLabel(r)) + '</th>'; }).join('') + '</tr>';
    var body = D.grid.map(function (row) { return '<tr><th scope="row">' + esc(row[0]) + '</th>' + row.slice(1).map(function (v) { return '<td>' + esc(v) + '</td>'; }).join('') + '</tr>'; }).join('');
    all.innerHTML = '<div class="who"><span class="tag">All rotations</span><h2>Coaches by round</h2><p>Anyone not listed in a round is off rotation.</p></div><div class="grid-scroll"><table><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>' + actions();
  }

  function route() {
    var h = decodeURIComponent(location.hash.slice(1));
    picker.hidden = agenda.hidden = all.hidden = true;
    document.body.classList.toggle('viewing', !!h);
    if (h === 'all-rotations') { allView(); all.hidden = false; window.scrollTo(0, 0); return; }
    var m = /^(p|c)-(.+)$/.exec(h), ok = false;
    if (m) {
      var list = m[1] === 'p' ? D.participants : D.coaches;
      var hit = list.filter(function (x) { return slug(x.n) === m[2]; })[0];
      if (hit) { ok = m[1] === 'p' ? participantView(hit.n) : coachView(hit.n); if (ok) store('ms-last', h); }
    }
    if (ok) { agenda.hidden = false; window.scrollTo(0, 0); } else { picker.hidden = false; document.body.classList.remove('viewing'); }
  }
  document.addEventListener('click', function (e) {
    if (e.target.closest('[data-back]')) { store('ms-last', ''); location.hash = ''; document.body.classList.remove('viewing'); picker.hidden = false; agenda.hidden = all.hidden = true; }
  });
  window.addEventListener('hashchange', route);

  if (!location.hash) { var last = load('ms-last'); if (last) { location.hash = last; return; } }
  route();
})();
</script>
</body>
</html>
